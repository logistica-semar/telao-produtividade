<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Produtividade - FLV</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000000;
    font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
  body.repouso{cursor:none}
  #palco{position:fixed;inset:0;overflow:hidden}
  .moldura{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;visibility:hidden}
  .moldura.ativa{visibility:visible}
  .moldura iframe{position:absolute;left:0;top:0;width:100%;border:0;display:block}
  /* Botão sempre visível para abrir o menu, inclusive com controle de TV. */
  #gatilho{position:fixed;left:22px;bottom:22px;z-index:12;width:52px;height:52px;
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.22);border-radius:50%;
    background:rgba(8,14,26,.72);color:#EAF1FB;font-size:19px;cursor:pointer;
    opacity:.34;transition:opacity .25s ease,transform .25s ease}
  #gatilho:hover,#gatilho:focus-visible{opacity:1;transform:scale(1.06)}
  #gatilho.escondido{opacity:0;pointer-events:none}
  /* Menu ancorado à esquerda e de tamanho fixo de propósito: nada muda de
     lugar quando a página troca, então acertar o botão pelo controle da TV
     continua previsível. */
  #barra{position:fixed;left:22px;top:50%;z-index:14;
    width:268px;height:250px;
    transform:translate(-18px,-50%);
    display:flex;flex-direction:column;gap:12px;padding:18px;
    border-radius:20px;border:1px solid rgba(255,255,255,.16);
    background:rgba(8,14,26,.93);color:#EAF1FB;font-size:14px;
    box-shadow:0 28px 70px rgba(0,0,0,.55);
    opacity:0;pointer-events:none;visibility:hidden;
    transition:opacity .28s cubic-bezier(.22,1,.36,1),transform .28s cubic-bezier(.22,1,.36,1)}
  #barra.aberta{opacity:1;pointer-events:auto;visibility:visible;transform:translate(0,-50%)}
  #rotulo{flex:none;min-width:0;display:flex;flex-direction:column;gap:3px;height:44px}
  #rotulo b{font-weight:600;font-size:15px;line-height:1.25;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #rotulo small{opacity:.55;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #contador{flex:none;height:26px;display:flex;align-items:center;gap:7px;
    font-size:12.5px;opacity:.6;font-variant-numeric:tabular-nums}
  #contador::before{content:"";width:7px;height:7px;border-radius:50%;background:#4D97F5}
  .sep{flex:none;height:1px;background:rgba(255,255,255,.14)}
  .linha{flex:none;display:flex;gap:8px}
  #barra button,#barra a{flex:1 1 0;height:46px;
    display:inline-flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);border-radius:12px;
    color:#EAF1FB;font:inherit;font-size:17px;line-height:1;text-decoration:none;cursor:pointer;
    transition:background .18s ease,border-color .18s ease}
  #barra button:hover,#barra a:hover{background:rgba(255,255,255,.12)}
  #barra button:focus-visible,#barra a:focus-visible{outline:none;border-color:#4D97F5;background:rgba(77,151,245,.22)}
  @media (prefers-reduced-motion: reduce){#barra{transition:none}}
  @media (max-height: 420px){#barra{height:auto;top:auto;bottom:88px;transform:translate(-18px,0)}
    #barra.aberta{transform:translate(0,0)}}
</style>
</head>
<body tabindex="-1">
<div id="palco"></div>
<button id="gatilho" type="button" title="Abrir menu" aria-label="Abrir menu">&#9776;</button>
<div id="barra" role="toolbar" aria-label="Controles do telão">
  <span id="rotulo"><b></b><small></small></span>
  <span id="contador"></span>
  <span class="sep"></span>
  <div class="linha">
    <button data-acao="anterior" title="Anterior (seta esquerda)" aria-label="Anterior">&#8249;</button>
    <button data-acao="pausar" title="Pausar (espaço)" aria-label="Pausar">&#10073;&#10073;</button>
    <button data-acao="proximo" title="Próximo (seta direita)" aria-label="Próximo">&#8250;</button>
  </div>
  <div class="linha">
    <a href="index.html" title="Voltar ao início" aria-label="Voltar ao início">&#8962;</a>
    <button data-acao="tela-cheia" title="Tela cheia (F)" aria-label="Tela cheia">&#9974;</button>
    <button data-acao="fechar" title="Fechar menu" aria-label="Fechar menu">&#10005;</button>
  </div>
</div>
<script>
var SEQUENCIA = [{"url":"https://app.powerbi.com/view?r=eyJrIjoiNDI5MGZiY2EtYjMyNC00NWE2LTk0OGMtMjFmMTFlMGQ2Yzc5IiwidCI6IjhmYzk2YTgyLTkzNGYtNGFjMC05OWMwLWFjMmZkZDExODJhOCJ9&pageName=4d7c0aca23ac5ae3b32b","titulo":"F-1","relatorio":"Produtividade - FLV","segundos":240},{"url":"https://app.powerbi.com/view?r=eyJrIjoiNDI5MGZiY2EtYjMyNC00NWE2LTk0OGMtMjFmMTFlMGQ2Yzc5IiwidCI6IjhmYzk2YTgyLTkzNGYtNGFjMC05OWMwLWFjMmZkZDExODJhOCJ9&pageName=65f44c27a3ac3027ee6a","titulo":"F-2","relatorio":"Produtividade - FLV","segundos":240},{"url":"https://app.powerbi.com/view?r=eyJrIjoiNDI5MGZiY2EtYjMyNC00NWE2LTk0OGMtMjFmMTFlMGQ2Yzc5IiwidCI6IjhmYzk2YTgyLTkzNGYtNGFjMC05OWMwLWFjMmZkZDExODJhOCJ9&pageName=4d7d4d5e0eebac9b2342","titulo":"F-5","relatorio":"Produtividade - FLV","segundos":240},{"url":"https://app.powerbi.com/view?r=eyJrIjoiNDI5MGZiY2EtYjMyNC00NWE2LTk0OGMtMjFmMTFlMGQ2Yzc5IiwidCI6IjhmYzk2YTgyLTkzNGYtNGFjMC05OWMwLWFjMmZkZDExODJhOCJ9&pageName=2f7a8c5be04e6a8ba64d","titulo":"F-6","relatorio":"Produtividade - FLV","segundos":240},{"url":"https://app.powerbi.com/view?r=eyJrIjoiNDI5MGZiY2EtYjMyNC00NWE2LTk0OGMtMjFmMTFlMGQ2Yzc5IiwidCI6IjhmYzk2YTgyLTkzNGYtNGFjMC05OWMwLWFjMmZkZDExODJhOCJ9&pageName=75fd8f082127e62adb56","titulo":"F-7","relatorio":"Produtividade - FLV","segundos":240}];
var MINUTOS_ATUALIZACAO = 30;
var RECORTAR_BARRA = true;
(function () {
  if (!SEQUENCIA.length) { document.body.innerHTML = "<p style=\"color:#fff;font:16px system-ui;padding:24px\">Nenhuma página selecionada.</p>"; return; }

  var palco = document.getElementById("palco");
  var barra = document.getElementById("barra");
  var gatilho = document.getElementById("gatilho");
  var rotuloTitulo = document.querySelector("#rotulo b");
  var rotuloFonte = document.querySelector("#rotulo small");
  var contador = document.getElementById("contador");
  var INTERVALO_RECARGA = MINUTOS_ATUALIZACAO * 60 * 1000;
  var ESPERA_MENU = 60000;
  var ALTURA_BARRA_PBI = 56;

  var atual = 0, pausado = false, restante = 0;
  var fecharMenu = null, esconderCursor = null, preparoProxima = null, esperaQuadro = null;
  var ESPERA_QUADRO = 20000;

  var molduras = SEQUENCIA.map(function (item, indice) {
    var moldura = document.createElement("div");
    moldura.className = "moldura";
    var quadro = document.createElement("iframe");
    quadro.setAttribute("allowfullscreen", "true");
    quadro.setAttribute("frameborder", "0");
    moldura.appendChild(quadro);
    palco.appendChild(moldura);
    var registro = { no: moldura, quadro: quadro, carregadoEm: 0, pronto: false, indice: indice };
    quadro.addEventListener("load", function () {
      // Chegou: se é a página que está sendo esperada, entra em cena agora.
      if (atual === indice) revelar(registro);
      else registro.pronto = true;
    });
    return registro;
  });

  /* Um quadro de cada vez. Abrindo todas as páginas juntas, o Power BI recebe
     várias sessões simultâneas do mesmo relatório publicado, e nesse aperto
     costuma devolver a página inicial no lugar da que o pageName pediu: o
     telão passa a girar mostrando sempre a mesma página. Carregado sob
     demanda, cada quadro pede a sua página sozinho. */
  function carregar(moldura) {
    if (moldura.carregadoEm) return;
    moldura.carregadoEm = Date.now();
    moldura.quadro.src = SEQUENCIA[moldura.indice].url;
  }

  function dimensionar() {
    // Navegador de TV e modo quiosque às vezes reportam 0 no primeiro quadro;
    // sem a reserva os iframes nasceriam com altura zero e ficariam assim.
    var visivel = window.innerHeight || document.documentElement.clientHeight || 720;
    var altura = RECORTAR_BARRA ? (visivel + ALTURA_BARRA_PBI) : visivel;
    molduras.forEach(function (m) { m.quadro.style.height = altura + "px"; });
  }
  dimensionar();
  window.addEventListener("resize", dimensionar);

  function recarregar(moldura) {
    moldura.pronto = false;
    moldura.quadro.src = SEQUENCIA[moldura.indice].url + "&_rvz=" + Date.now();
    moldura.carregadoEm = Date.now();
  }

  /* Troca o que está em cena e começa a contar o tempo desta página a partir
     de agora: o relógio só anda com a página de fato à vista. */
  function revelar(moldura) {
    clearTimeout(esperaQuadro);
    moldura.pronto = true;
    molduras.forEach(function (m) { m.no.classList.toggle("ativa", m === moldura); });
    restante = SEQUENCIA[moldura.indice].segundos;
    pintarContador();
  }

  function mostrar(indice) {
    var anterior = molduras[atual];
    atual = (indice + molduras.length) % molduras.length;
    var alvo = molduras[atual];
    carregar(alvo);

    // O rótulo troca na hora, mesmo que a página ainda esteja vindo: quem
    // apertou o botão precisa ver que o comando foi aceito.
    var item = SEQUENCIA[atual];
    rotuloTitulo.textContent = item.titulo;
    rotuloFonte.textContent = item.relatorio || "";

    if (alvo.pronto) {
      revelar(alvo);
    } else {
      /* Ainda carregando. Trocar agora deixaria a tela preta até o Power BI
         responder, e de fora isso parece um botão que não funcionou. A página
         atual fica em cena até a próxima estar pronta; o prazo abaixo é a rede
         de segurança para o caso de o load nunca chegar. */
      restante = item.segundos;
      pintarContador();
      clearTimeout(esperaQuadro);
      esperaQuadro = setTimeout(function () {
        if (atual === alvo.indice) revelar(alvo);
      }, ESPERA_QUADRO);
    }

    // A próxima só começa a carregar depois que a de agora já pegou a rede,
    // e entra em cena pronta, sem ninguém ver o carregamento.
    clearTimeout(preparoProxima);
    preparoProxima = setTimeout(function () {
      carregar(molduras[(atual + 1) % molduras.length]);
    }, 2500);

    // A recarga acontece com o quadro já fora de vista: quando ele voltar a
    // aparecer, os dados estão novos e ninguém viu o carregamento.
    if (anterior && anterior.indice !== atual && Date.now() - anterior.carregadoEm >= INTERVALO_RECARGA) {
      recarregar(anterior);
    }
  }

  function pintarContador() {
    if (!molduras[atual].pronto) { contador.textContent = "carregando…"; return; }
    contador.textContent = pausado ? "pausado" : (restante + "s");
  }

  // Um relógio único de 1s comanda tudo: mais previsível numa TV ligada por
  // semanas do que uma cadeia de setTimeout se acumulando.
  setInterval(function () {
    if (pausado) return;
    // Esperando um quadro entrar em cena: o relógio para, senão a rotação
    // passaria adiante por baixo de uma página que ninguém chegou a ver.
    if (!molduras[atual].pronto) return;
    restante--;
    if (restante <= 0) { mostrar(atual + 1); return; }
    pintarContador();
  }, 1000);

  // Com uma página só não existe "fora de vista", então recarrega no lugar.
  if (molduras.length === 1) {
    setInterval(function () { recarregar(molduras[0]); }, INTERVALO_RECARGA);
  }

  // O menu abre por botão e fica aberto. Só se fecha sozinho depois de um
  // minuto sem ninguém mexer, para não sumir no meio de um clique de controle.
  function abrirMenu() {
    barra.classList.add("aberta");
    gatilho.classList.add("escondido");
    // Um clique dentro do dashboard leva o foco para o iframe do Power BI, e
    // a partir daí as setas são dele, não do telão. O botão de menu está
    // fora dos iframes e sempre responde: usá-lo traz o foco de volta.
    if (document.activeElement && document.activeElement !== document.body) {
      try { document.activeElement.blur(); } catch (e) {}
    }
    document.body.focus();
    adiarFechamento();
  }

  function encerrarMenu() {
    barra.classList.remove("aberta");
    gatilho.classList.remove("escondido");
    clearTimeout(fecharMenu);
  }

  function adiarFechamento() {
    clearTimeout(fecharMenu);
    fecharMenu = setTimeout(encerrarMenu, ESPERA_MENU);
  }

  gatilho.addEventListener("click", abrirMenu);
  barra.addEventListener("mousemove", adiarFechamento);
  barra.addEventListener("focusin", adiarFechamento);

  function telaCheia() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }

  barra.addEventListener("click", function (evento) {
    var acao = evento.target.getAttribute("data-acao");
    if (!acao) return;
    if (acao === "anterior") mostrar(atual - 1);
    else if (acao === "proximo") mostrar(atual + 1);
    else if (acao === "tela-cheia") telaCheia();
    else if (acao === "pausar") { pausado = !pausado; pintarContador(); }
    else if (acao === "fechar") { encerrarMenu(); return; }
    adiarFechamento();
  });

  document.addEventListener("keydown", function (evento) {
    if (evento.key === "ArrowRight") { mostrar(atual + 1); abrirMenu(); }
    else if (evento.key === "ArrowLeft") { mostrar(atual - 1); abrirMenu(); }
    else if (evento.key === " ") { evento.preventDefault(); pausado = !pausado; pintarContador(); abrirMenu(); }
    else if (evento.key === "f" || evento.key === "F") telaCheia();
    else if (evento.key === "Escape") encerrarMenu();
    else if (evento.key === "Enter" && !barra.classList.contains("aberta")) abrirMenu();
  });

  // O cursor some sozinho, mas o botão de menu continua lá.
  document.addEventListener("mousemove", function () {
    document.body.classList.remove("repouso");
    clearTimeout(esconderCursor);
    esconderCursor = setTimeout(function () { document.body.classList.add("repouso"); }, 3000);
  }, { passive: true });

  mostrar(0);
  esconderCursor = setTimeout(function () { document.body.classList.add("repouso"); }, 3000);
})();
</script>
</body>
</html>
